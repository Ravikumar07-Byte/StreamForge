name: StreamForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Kafka
        run: |
          docker compose up -d

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if docker exec streamforge-kafka \
              /opt/kafka/bin/kafka-topics.sh \
              --list \
              --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              echo "Kafka is ready."
              exit 0
            fi

            echo "Waiting for Kafka... attempt /30"
            sleep 2
          done

          echo "Kafka did not become ready."
          docker compose ps
          docker logs streamforge-kafka
          exit 1

      - name: Create Kafka topic
        run: |
          docker exec streamforge-kafka \
            /opt/kafka/bin/kafka-topics.sh \
            --create \
            --if-not-exists \
            --topic truck-telemetry \
            --partitions 4 \
            --replication-factor 1 \
            --bootstrap-server localhost:9092

      - name: Verify Kafka
        run: |
          docker compose ps
          docker exec streamforge-kafka \
            /opt/kafka/bin/kafka-topics.sh \
            --describe \
            --topic truck-telemetry \
            --bootstrap-server localhost:9092

      - name: Run tests
        run: |
          python -m pytest
