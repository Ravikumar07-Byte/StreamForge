name: StreamForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Kafka
        run: |
          docker compose up -d
          sleep 10
          docker compose ps

      - name: Verify Kafka
        run: |
          docker exec streamforge-kafka \
            /opt/kafka/bin/kafka-topics.sh \
            --list \
            --bootstrap-server localhost:9092

      - name: Run tests
        run: |
          python -m pytest
